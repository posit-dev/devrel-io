name: Validate Config

on:
  pull_request:
    paths:
      - 'config.toml'
      - 'scripts/sort-config.py'
      - '.github/workflows/validate-config.yml'
  push:
    branches:
      - main
    paths:
      - 'config.toml'
      - 'scripts/sort-config.py'
      - '.github/workflows/validate-config.yml'

jobs:
  check-sorted:
    name: Check config.toml is sorted
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Check if config.toml is sorted
        run: |
          uv run python scripts/sort-config.py --check

      - name: Provide fix instructions on failure
        if: failure()
        run: |
          echo "::error::config.toml is not sorted alphabetically"
          echo "To fix this, run: just sort-config"
          echo "Or: uv run python scripts/sort-config.py"
          exit 1
