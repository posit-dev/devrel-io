name: Fetch DevRel Data

on:
  schedule:
    # Run daily at 1am ET (6am UTC)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-and-aggregate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Fetch GitHub events for all projects
        run: |
          uv run python fetch_github.py --token ${{ secrets.GH_TOKEN }}

      - name: Fetch Plausible analytics for all projects
        run: |
          uv run python fetch_plausible.py --api-key ${{ secrets.PLAUSIBLE_KEY }}

      - name: Fetch PyPI downloads for all projects
        run: |
          uv run python fetch_pypi.py

      - name: Fetch CRAN downloads for all projects
        run: |
          uv run python fetch_cran.py

      - name: Fetch Open VSX metrics for all projects
        run: |
          uv run python fetch_openvsx.py

      - name: Aggregate data files
        run: |
          ./aggregate-data.sh

      - name: Combine output into one Parquet file
        run: |
          uv run python output_to_parquet.py

      - name: Commit and push data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "Update devrel data - $(date -u +'%Y-%m-%d')"
          git push
