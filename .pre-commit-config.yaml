# Pre-commit hooks for DevRel I/O
#
# Optional: Install pre-commit hooks to automatically sort config.toml before commits
#
# Setup:
#   1. Install pre-commit: pip install pre-commit (or brew install pre-commit)
#   2. Install hooks: pre-commit install
#   3. Done! The hooks will run automatically on git commit
#
# Manual run:
#   pre-commit run --all-files
#
# More info: https://pre-commit.com

repos:
  - repo: local
    hooks:
      - id: sort-config
        name: Sort config.toml
        entry: uv run python scripts/sort-config.py
        language: system
        files: ^config\.toml$
        pass_filenames: false
