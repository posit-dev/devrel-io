# Era audit of the export of 2026-10-20: the original site-level rows (page
# IS NULL) end on 2026-06-22 (2026-06-21 for great-tables, 2026-05-31 for
# supported-by-posit, 2026-05-19 for posit-dev.github.io/pointblank), and
# daily_site_* starts on 2026-06-22 for most sites (2026-03-02 for
# shiny.posit.co), so both eras have 2026-06-22.
[[data_dict.notes]]
tables = ["metrics", "metrics_filled", "indicators"]
source = "plausible"
text = """
devrel-io switched collection systems in June 2026. Before, site-level \
traffic is daily_pageviews, daily_visitors and daily_visits with page IS \
NULL, through 2026-06-22; after, it's daily_site_*, from 2026-06-22 for \
most sites (2026-03-02 for shiny.posit.co). Per-page rows (page IS NOT \
NULL) start on 2026-03-02 for shiny.posit.co and on 2026-06-22 for the \
other sites, and share their metric names with the old site-level rows, so \
filter on page before aggregating. The site_traffic and traffic_metric \
definitions combine the eras, and the pageviews, visitors and visits \
measures use them."""

[[data_dict.notes]]
tables = ["metrics"]
source = "cran"
text = """
The series misses 17 days that cranlogs has no data for: seven days in \
October 2012, 2012-12-29 to 2012-12-31, 2025-08-25, 2025-08-26 and \
2025-08-29 to 2025-09-02. Range sums over those days undercount."""

[[data_dict.notes]]
tables = ["metrics", "metrics_filled"]
source = "github"
text = """
total_reactions was backfilled for every open and closed issue and pull \
request on 2026-07-27, and is updated since for the items that change. \
Read the latest value per ref (or use metrics_filled); most items have no \
reactions."""

[[data_dict.notes]]
tables = ["projects"]
column = "tags"
text = """
Tags are sparse and aren't a census of the portfolio: derive rosters from \
targets and the data rather than from tags. Most projects are GitHub-only \
repositories of the posit-dev, rstudio, tidyverse and quarto-dev \
organizations; only about 20 curated ones have package or site metrics."""

[[data_dict.definitions]]
table = "metrics"
name = "site_traffic"
label = "site-level rows, both collection eras"
description = """
Site-level website analytics rows of both collection eras, without the \
day the eras overlap twice. Use it with traffic_metric, and with \
deduplicated across projects."""
expr = """
source = 'plausible'
AND ((page IS NULL
      AND metric IN ('daily_pageviews', 'daily_visitors', 'daily_visits')
      AND date < '2026-06-22')
     OR metric LIKE 'daily_site_%')"""

[[data_dict.definitions]]
table = "metrics"
name = "traffic_metric"
label = "site metric name across eras"
description = """
Maps the daily_site_* names onto daily_pageviews, daily_visitors and \
daily_visits, so the two collection eras aggregate under one name."""
expr = """
CASE
  WHEN metric = 'daily_site_pageviews' THEN 'daily_pageviews'
  WHEN metric = 'daily_site_visitors' THEN 'daily_visitors'
  WHEN metric = 'daily_site_visits' THEN 'daily_visits'
  ELSE metric
END"""

[[data_dict.definitions]]
table = "metrics"
name = "pageviews"
description = "Site-level pageviews of both collection eras. Counts every target once."
expr = "SUM(CASE WHEN site_traffic AND traffic_metric = 'daily_pageviews' AND deduplicated THEN value ELSE 0 END)"

[[data_dict.definitions]]
table = "metrics"
name = "visitors"
label = "visitor-days, not distinct people"
description = """
Daily unique visitors of the sites, both collection eras, summed: \
visitor-days, not distinct people. Present a range as visitor-days or a \
daily average. Counts every target once."""
expr = "SUM(CASE WHEN site_traffic AND traffic_metric = 'daily_visitors' AND deduplicated THEN value ELSE 0 END)"

[[data_dict.definitions]]
table = "metrics"
name = "visits"
description = "Site-level visits (sessions) of both collection eras. Counts every target once."
expr = "SUM(CASE WHEN site_traffic AND traffic_metric = 'daily_visits' AND deduplicated THEN value ELSE 0 END)"

[data_dict.glossary]
"package authorship" = """
Formal package authorship and maintainer roles aren't collected. Event \
users describe public contribution activity, not authorship, and may be \
used only as a clearly labeled proxy."""
"shiny.posit.co" = """
The Shiny website, for both the R and the Python framework. It's tracked \
under shiny-r and shiny-python with the same values; deduplicated keeps it \
under shiny-python, so query its traffic there or by target."""
