[data_dict]
name = "posit-oss-devrel"
label = "Posit open source devrel metrics"
description = """
Daily adoption and engagement metrics for Posit's open source projects, \
plus a catalog of the issues, pull requests, repositories, videos, blog \
posts and site entities behind them. This is public data about public \
projects."""

# Shared targets: the curated project keeps them. The posit/shiny extension
# and the shiny.posit.co site stay under shiny-python, whose Plausible series
# is continuous.
[data_dict.keep.openvsx]
"posit/shiny" = "shiny-python"

[data_dict.keep.plausible]
"shiny.posit.co" = "shiny-python"

# The content types the opensource.posit.co feeds set with vr:type.
[data_dict.values.content.type]
post = "opensource.posit.co blog post"
resource = "opensource.posit.co resource (video, talk, book, ...)"
